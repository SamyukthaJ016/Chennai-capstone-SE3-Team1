spring.application.name=sprint-06-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MyBatis Configuration
mybatis.mapper-locations=classpath*:/mapper/**/*.xml
mybatis.type-aliases-package=com.team1.trading.api
mybatis.configuration.map-underscore-to-camel-case=true

# JWT Configuration
# Secret key for HS256 signature verification. Must be shared with the auth service.
# For Sprint 6, this is read from the auth stub in services/auth-stub/README.md
# For Sprint 8, this comes from the real auth service configuration.
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:auth-service}

# Balance currency, ISO 4217
trade.currency=${TRADE_CURRENCY:USD}
