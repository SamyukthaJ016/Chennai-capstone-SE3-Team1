# Test Configuration - uses in-memory H2 database
# Every test context overrides spring.datasource.url with its own uniquely
# named in-memory H2 database; this entry is only the shared fallback.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
mybatis.mapper-locations=
jwt.secret=${JWT_SECRET:test-secret-key}
jwt.issuer=auth-service
trade.currency=USD
